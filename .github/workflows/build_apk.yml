name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Android SDK & Build APK
        run: |
          # 1. Locate directory containing pubspec.yaml
          APP_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          echo "Building in: $APP_DIR"
          cd "$APP_DIR"

          # 2. Generate Android platform files
          flutter create . --org com.fitai.trainer --platforms android

          # 3. Add Google AdMob ID to AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
              sed -i '/<application/a \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' "$MANIFEST"
            fi
          fi

          # 4. Set minSdkVersion to 23 and compileSdkVersion to 34
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 23/g' "$APP_GRADLE"
            sed -i 's/minSdk = .*/minSdk = 23/g' "$APP_GRADLE"
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' "$APP_GRADLE"
            sed -i 's/compileSdk = .*/compileSdk = 34/g' "$APP_GRADLE"
          fi

          # 5. Fetch dependencies and compile release APK
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
          
