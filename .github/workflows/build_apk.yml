name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Assemble & Compile APK
        run: |
          # 1. Create a clean Flutter project workspace
          cd /tmp
          flutter create --org com.fitai.trainer --platforms android app_workspace
          cd app_workspace

          # 2. Copy source files (handles both structured lib/ or flat uploads)
          LIB_FOUND=$(find "$GITHUB_WORKSPACE" -type d -name "lib" | head -n 1)
          if [ -n "$LIB_FOUND" ]; then
            echo "Found lib directory at: $LIB_FOUND"
            cp -r "$LIB_FOUND"/* lib/
          else
            echo "Gathering dart files and subdirectories into lib/..."
            cp "$GITHUB_WORKSPACE"/*.dart lib/ 2>/dev/null || true
            for dir_name in screens models providers services widgets auth home nutrition physique workouts coach subscription activity; do
              FOUND_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -name "$dir_name" | head -n 1)
              if [ -n "$FOUND_DIR" ]; then
                cp -r "$FOUND_DIR" lib/
              fi
            done
          fi

          # 3. Copy pubspec.yaml
          PUBSPEC_PATH=$(find "$GITHUB_WORKSPACE" -name "pubspec.yaml" | head -n 1)
          if [ -n "$PUBSPEC_PATH" ]; then
            echo "Found pubspec.yaml at: $PUBSPEC_PATH"
            cp "$PUBSPEC_PATH" pubspec.yaml
          fi

          # 4. Inject Google AdMob ID into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/a \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' "$MANIFEST"
          fi

          # 5. Set minimum SDK to 23 for sensor and ad support
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' "$GRADLE_FILE" 2>/dev/null || true
            sed -i 's/minSdkVersion .*/minSdkVersion 23/g' "$GRADLE_FILE" 2>/dev/null || true
          fi

          # 6. Fetch dependencies and compile APK
          flutter pub get
          flutter build apk --debug

          # 7. Move generated APK to output folder
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/output_apk/ai_fitness_trainer.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai_fitness_trainer_apk
          path: output_apk/ai_fitness_trainer.apk
          
