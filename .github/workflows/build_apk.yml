name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Assemble & Compile APK
        run: |
          # 1. Locate source directory containing pubspec.yaml
          SRC_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          echo "Found source files in: $SRC_DIR"
          
          # 2. Create clean Android project structure in a fresh directory
          cd /tmp
          flutter create --org com.fitai.trainer --platforms android app_workspace
          cd app_workspace

          # 3. Copy our application files into the clean workspace
          cp -r "$GITHUB_WORKSPACE/$SRC_DIR/lib" .
          cp "$GITHUB_WORKSPACE/$SRC_DIR/pubspec.yaml" .

          # 4. Inject Google AdMob ID into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/a \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' "$MANIFEST"
          fi

          # 5. Set minimum SDK to 23 for sensor and ad support
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' "$GRADLE_FILE" 2>/dev/null || true
            sed -i 's/minSdkVersion .*/minSdkVersion 23/g' "$GRADLE_FILE" 2>/dev/null || true
          fi

          # 6. Fetch packages and compile APK
          flutter pub get
          flutter build apk --debug

          # 7. Move generated APK to output folder
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/output_apk/ai_fitness_trainer.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai_fitness_trainer_apk
          path: output_apk/ai_fitness_trainer.apk
          
