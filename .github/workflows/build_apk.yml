name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Assemble & Compile APK
        run: |
          # 1. Create clean project structure in runner
          cd /tmp
          rm -rf app_build
          flutter create --org com.fitai.trainer app_build
          cd app_build
          rm -rf lib/*

          # 2. Copy all code files into lib/
          LIB_DIR=$(find "$GITHUB_WORKSPACE" -type d -name "lib" | head -n 1)
          if [ -n "$LIB_DIR" ]; then
            cp -r "$LIB_DIR"/* lib/
          else
            cp "$GITHUB_WORKSPACE"/*.dart lib/ 2>/dev/null || true
            for d in screens models providers services widgets auth home nutrition physique workouts coach subscription activity; do
              FOUND=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -name "$d" | head -n 1)
              if [ -n "$FOUND" ]; then cp -r "$FOUND" lib/; fi
            done
          fi

          # 3. Add required packages
          flutter pub add http image_picker google_mobile_ads fl_chart health shared_preferences provider

          # 4. Inject Google AdMob ID & set minSdkVersion to 23
          python3 -c "with open('android/app/src/main/AndroidManifest.xml') as f: x = f.read(); x = x.replace('</application>', '        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>\n    </application>'); open('android/app/src/main/AndroidManifest.xml', 'w').write(x)"
          python3 -c "import glob; [open(p, 'w').write(open(p).read().replace('flutter.minSdkVersion', '23')) for p in glob.glob('android/app/build.gradle*')]"

          # 5. Build the APK
          flutter build apk --debug

          # 6. Prepare download artifact
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/output_apk/ai_fitness_trainer.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai_fitness_trainer_apk
          path: output_apk/ai_fitness_trainer.apk
          
