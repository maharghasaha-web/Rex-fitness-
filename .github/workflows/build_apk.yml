name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Gradle Wrapper & Build APK
        run: |
          # 1. Locate directory containing pubspec.yaml
          APP_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          echo "Building project in: $APP_DIR"
          cd "$APP_DIR"

          # 2. Re-generate matching Android Gradle wrapper
          flutter create . --org com.fitai.trainer --platforms android

          # 3. Get dependencies and build release APK
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
          
