name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Assemble & Compile APK
        run: |
          cd /tmp
          rm -rf app_build
          mkdir -p app_build/lib
          cd app_build

          # Copy application Dart files
          LIB_DIR=$(find "$GITHUB_WORKSPACE" -type d -name "lib" | head -n 1)
          if [ -n "$LIB_DIR" ]; then
            cp -r "$LIB_DIR"/* lib/
          else
            cp "$GITHUB_WORKSPACE"/*.dart lib/ 2>/dev/null || true
            for d in screens models providers services widgets auth home nutrition physique workouts coach subscription activity; do
              FOUND=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -name "$d" | head -n 1)
              if [ -n "$FOUND" ]; then cp -r "$FOUND" lib/; fi
            done
          fi

          # Create project specification
          echo "name: ai_fitness_trainer" > pubspec.yaml
          echo "description: 'AI Personal Fitness Trainer'" >> pubspec.yaml
          echo "version: 1.0.0+1" >> pubspec.yaml
          echo "environment:" >> pubspec.yaml
          echo "  sdk: '>=3.0.0 <4.0.0'" >> pubspec.yaml
          echo "dependencies:" >> pubspec.yaml
          echo "  flutter:" >> pubspec.yaml
          echo "    sdk: flutter" >> pubspec.yaml
          echo "  http: ^1.2.0" >> pubspec.yaml
          echo "  image_picker: ^1.0.7" >> pubspec.yaml
          echo "  google_mobile_ads: ^5.0.0" >> pubspec.yaml
          echo "  fl_chart: ^0.66.2" >> pubspec.yaml
          echo "  health: ^10.1.0" >> pubspec.yaml
          echo "  shared_preferences: ^2.2.2" >> pubspec.yaml
          echo "  provider: ^6.1.1" >> pubspec.yaml
          echo "flutter:" >> pubspec.yaml
          echo "  uses-material-design: true" >> pubspec.yaml

          # Generate matching Android platform files
          flutter create . --org com.fitai.trainer --platforms android --project-name ai_fitness_trainer

          # Inject AdMob ID & set minimum SDK to 23
          python3 -c "with open('android/app/src/main/AndroidManifest.xml') as f: x = f.read(); x = x.replace('</application>', '        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>\n    </application>'); open('android/app/src/main/AndroidManifest.xml', 'w').write(x)"
          python3 -c "import glob; [open(p, 'w').write(open(p).read().replace('flutter.minSdkVersion', '23')) for p in glob.glob('android/app/build.gradle*')]"

          # Build APK
          flutter build apk --debug

          # Move APK to output directory
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/output_apk/ai_fitness_trainer.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai_fitness_trainer_apk
          path: output_apk/ai_fitness_trainer.apk
          
